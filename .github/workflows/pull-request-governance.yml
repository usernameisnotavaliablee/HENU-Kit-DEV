name: Pull Request Governance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  branch-name:
    runs-on: ubuntu-24.04
    steps:
      - name: Require a conventional branch name
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # Issues are disabled in this fork, so there is no issue number to cite for the
          # branches used here. Accept two shapes: the issue-suffixed feature|fix/<area>/hc-<n>
          # and a plain <type>/<area> (feature|fix|codex). The suffix is optional everywhere,
          # not only here -- nothing below branches on whether issues are enabled.
          [[ "$HEAD_REF" =~ ^((feature|fix)/[a-z0-9][a-z0-9-]*/hc-[0-9]+|(feature|fix|codex)/[a-z0-9][a-z0-9-]*)$ ]] || {
            echo "Branch '$HEAD_REF' must match feature|fix/<area>/hc-<issue> or <type>/<area> with type in feature|fix|codex." >&2
            exit 1
          }

  review-evidence:
    runs-on: ubuntu-24.04
    steps:
      - name: Require current-commit Standards and Spec evidence
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          body = os.environ.get("PR_BODY", "")
          head_sha = os.environ["HEAD_SHA"]
          expected = {
              "Review-Head": head_sha,
              "Standards-Review": "0 findings",
              "Spec-Review": "0 findings",
          }
          for field, value in expected.items():
              match = re.search(rf"(?mi)^{re.escape(field)}:\s*`?([^`\r\n]+)`?\s*$", body)
              if not match or match.group(1).strip().lower() != value.lower():
                  raise SystemExit(f"PR body must contain `{field}: {value}` for the current commit.")
          PY
